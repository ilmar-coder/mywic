name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p ecoreset-core
      - run: cargo build --release -p ecoreset -p ecoreset-cli
      - name: Arquivos
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/ecoreset.exe dist/EcoReset.exe
          Copy-Item target/release/ecoreset-cli.exe dist/ecoreset-cli.exe
      - uses: actions/upload-artifact@v4
        with:
          name: EcoReset-windows
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: cargo test -p ecoreset-core
      - name: App universal
        run: |
          ./scripts/package-macos.sh
          mkdir -p dist && ditto -c -k --keepParent target/EcoReset.app dist/EcoReset-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: EcoReset-mac
          path: dist/EcoReset-mac.zip

  fedora-rpm:
    runs-on: ubuntu-latest
    # gerado no próprio Fedora, com as mesmas bibliotecas da estação
    container: fedora:latest
    steps:
      - name: Dependências
        run: dnf -y install git gcc pkgconf-pkg-config libusb1-devel openssl-devel libxkbcommon-devel rpm-build cups-client
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p ecoreset-core
      - run: cargo build --release -p ecoreset -p ecoreset-cli
      - name: Gerar o RPM
        run: |
          cargo install cargo-generate-rpm --locked
          cargo generate-rpm -p crates/app --set-metadata 'release = "${{ github.run_number }}%{?dist}"' || cargo generate-rpm -p crates/app
          mkdir -p dist && cp target/generate-rpm/*.rpm dist/
      - name: Instalar e conferir o RPM
        run: |
          dnf -y install ./dist/*.rpm
          rpm -ql ecoreset
          ecoreset-cli code 1726
          ecoreset-cli wic-log crates/core/tests/data/wicreset_l3250_trial.log
          test -f /usr/lib/udev/rules.d/70-ecoreset.rules
      - uses: actions/upload-artifact@v4
        with:
          name: EcoReset-fedora-rpm
          path: dist/*.rpm

  # Ao criar uma tag v* (ex.: v0.2.0), publica os arquivos na página de Releases.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, fedora-rpm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            **Downloads**
            - **Windows:** `EcoReset.exe` (tela) e `ecoreset-cli.exe` (linha de comando). Não precisa instalar; o USB usa o driver de impressora do próprio Windows. Na primeira vez o SmartScreen pode avisar: **Mais informações → Executar assim mesmo**.
            - **Mac (Apple Silicon e Intel):** `EcoReset-mac.zip`, com o libusb embutido.
            - **Fedora:** `sudo dnf install ./ecoreset-*.rpm` — aparece "EcoReset" no menu e já traz a regra que libera o USB das Epson e Canon.

