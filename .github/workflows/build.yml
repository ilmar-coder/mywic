name: build

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s . -p "test_*.py" -v
      - run: python -m pip install pyinstaller
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name EcoReset ecoreset_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: EcoReset-windows
          path: dist/EcoReset.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s . -p "test_*.py" -v
      - run: python -m pip install pyinstaller
      - run: brew install libusb
      - run: python -m PyInstaller --noconfirm --windowed --name EcoReset --osx-bundle-identifier com.ilmar.ecoreset --add-binary "$(brew --prefix)/lib/libusb-1.0.0.dylib:." ecoreset_app.py
      - run: ditto -c -k --keepParent dist/EcoReset.app dist/EcoReset-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: EcoReset-mac
          path: dist/EcoReset-mac.zip
