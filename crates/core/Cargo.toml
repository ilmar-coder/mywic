[package]
name = "ecoreset-core"
description = "Núcleo do EcoReset: protocolo Epson (SNMP e USB/D4), Canon (IPP e IVEC) e banco de modelos"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fastrand = "2"
gethostname = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
# libusb embutido: o .app funciona sem o Homebrew
rusb = { version = "0.9", features = ["vendored"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
rusb = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Printing",
  "Win32_Security",
] }

[dev-dependencies]
tempfile = "3"
sha1 = "0.10"
