<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0E5F63"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D7F5EF"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- seta circular de "reset" em volta da gota -->
  <path d="M 512 214 A 300 300 0 1 1 252 362" fill="none" stroke="#FFFFFF" stroke-opacity="0.92"
        stroke-width="58" stroke-linecap="round"/>
  <path d="M 196 300 L 330 300 L 263 418 Z" fill="#FFFFFF" fill-opacity="0.92"
        transform="rotate(-28 263 359)"/>
  <!-- gota de tinta -->
  <path d="M 512 300 C 512 300 372 470 372 576 A 140 140 0 0 0 652 576 C 652 470 512 300 512 300 Z"
        fill="url(#drop)"/>
  <!-- três pontos de cor (ciano, magenta, amarelo) -->
  <circle cx="452" cy="600" r="26" fill="#06B6D4"/>
  <circle cx="512" cy="636" r="26" fill="#EC4899"/>
  <circle cx="572" cy="600" r="26" fill="#FACC15"/>
</svg>
